<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tra cứu điểm Trường THPT Lê Duẩn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Container chính */
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .header h1 span {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 50px;
            display: inline-block;
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
        }

        /* Card chính */
        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }

        /* Phần tìm kiếm */
        .search-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px;
        }

        .search-box {
            background: white;
            border-radius: 60px;
            padding: 8px;
            display: flex;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 18px 24px;
            font-size: 1.1rem;
            border-radius: 60px;
            outline: none;
            font-weight: 500;
        }

        .search-box input::placeholder {
            color: #aaa;
            font-weight: normal;
        }

        .search-box button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0 32px;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        /* Phần kết quả */
        .result-section {
            padding: 30px;
            background: white;
        }

        /* Thông tin học sinh */
        .student-info {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(102,126,234,0.2);
        }

        .student-info h3 {
            font-size: 1.3rem;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .info-item {
            background: white;
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .info-label {
            font-weight: 600;
            color: #555;
        }

        .info-value {
            font-weight: 700;
            color: #333;
            font-size: 1.1rem;
        }

        /* Bảng điểm */
        .score-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .score-table th {
            background: #667eea;
            color: white;
            padding: 14px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .score-table th:first-child {
            border-radius: 16px 0 0 0;
        }

        .score-table th:last-child {
            border-radius: 0 16px 0 0;
        }

        .score-table td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-weight: 500;
        }

        .score-table tr:hover td {
            background: #f8f9ff;
        }

        /* Loading & thông báo */
        .loading, .error, .success {
            text-align: center;
            padding: 40px;
            border-radius: 24px;
        }

        .loading {
            background: #f0f0f0;
            color: #667eea;
        }

        .error {
            background: #fee;
            color: #e74c3c;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }

        /* Animation */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .search-box {
                flex-direction: column;
                border-radius: 32px;
            }
            
            .search-box button {
                padding: 14px;
            }
            
            .info-item {
                flex-direction: column;
                text-align: center;
                gap: 8px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .search-section, .result-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>📘 Tra Cứu Điểm Kiểm Tra 📘</span></h1>
            <p>Kỳ kiểm tra cuối kỳ 2 - Nhập số báo danh để xem kết quả</p>
        </div>

        <div class="card">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="sbdInput" placeholder="🔢 Nhập số báo danh... (VD: 109389)" autocomplete="off">
                    <button id="searchBtn">🔍 Tra cứu</button>
                </div>
            </div>

            <div id="resultContainer" class="result-section">
                <div class="loading">
                    ⏳ Đang tải dữ liệu điểm thi...
                </div>
            </div>
        </div>

        <div class="footer">
            © 2026 - Hệ thống tra cứu điểm trực tuyến | Bản quyền thuộc về CLB Tin Học 
        </div>
    </div>

    <script>
        // 👇👇👇 THAY LINK API CỦA BẠN VÀO ĐÂY 👇👇👇
        const API_URL = "https://script.google.com/macros/s/AKfycbxOcwecc9-5kGUWWdSQySoZMa7TstuKzXjdk8ad45W2mnSds_8M7Sp47f-P-5vPpgfemA/exec";
        
        let studentsData = [];

        async function loadData() {
            const container = document.getElementById("resultContainer");
            container.innerHTML = `<div class="loading">⏳ Đang tải dữ liệu...</div>`;
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                console.log("✅ Đã tải:", data.length, "học sinh");
                
                if (!Array.isArray(data)) throw new Error("Dữ liệu không hợp lệ");
                
                studentsData = data;
                container.innerHTML = `<div class="success">✅ Đã tải thành công ${studentsData.length} học sinh. Nhập SBD để tra cứu!</div>`;
                
                setTimeout(() => {
                    if (container.innerHTML.includes("thành công")) {
                        container.innerHTML = `<div class="loading">📌 Nhập số báo danh vào ô trên để xem điểm</div>`;
                    }
                }, 3000);
                
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="error">
                        ⚠️ Không thể tải dữ liệu<br><br>
                        🔧 Kiểm tra:<br>
                        • Link API đã đúng chưa?<br>
                        • Google Apps Script đã deploy với quyền "Anyone"?
                    </div>`;
            }
        }

        function renderResult(sbd) {
            const container = document.getElementById("resultContainer");
            
            const student = studentsData.find(s => String(s.SBD).trim() === String(sbd).trim());
            
            if (!student) {
                const allSBD = studentsData.slice(0, 10).map(s => s.SBD).join(", ");
                container.innerHTML = `
                    <div class="error">
                        ❌ Không tìm thấy học sinh có SBD: <strong>${sbd}</strong><br><br>
                        📋 Gợi ý các SBD có trong hệ thống: ${allSBD}${studentsData.length > 10 ? "..." : ""}
                    </div>`;
                return;
            }
            
            const monHoc = ["Toán", "Ngữ Văn", "Tiếng Anh", "Vật Lý", "Hóa Học", "Sinh học", "KTPL", "Địa Lý", "Công Nghệ", "Lịch Sử", "Thể Dục", "Quốc Phòng", "HĐTN", "GDĐP", "Tin Học"];
            
            let diemRows = "";
            for (let mon of monHoc) {
                let diem = student[mon];
                if (diem === undefined || diem === null || diem === "") diem = "—";
                // Tô màu điểm
                let color = "";
                if (typeof diem === "number") {
                    if (diem >= 8) color = "#2e7d32";
                    else if (diem >= 5) color = "#f57c00";
                    else color = "#c62828";
                }
                diemRows += `
                    <tr>
                        <td style="font-weight:600; text-align:left; padding-left:20px;">📖 ${mon}</td>
                        <td style="font-weight:700; color:${color};">${diem}</td>
                    </tr>
                `;
            }
            
            const html = `
                <div class="student-info">
                    <h3>🎓 Thông tin thí sinh</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">🔢 Số báo danh:</span>
                            <span class="info-value">${student.SBD}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">👤 Họ và tên:</span>
                            <span class="info-value">${student["Họ tên"] || "—"}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">🏫 Lớp:</span>
                            <span class="info-value">${student["Lớp"] || "—"}</span>
                        </div>
                    </div>
                </div>
                
                <h3 style="margin-bottom: 15px; font-size: 1.2rem;">📊 Bảng điểm chi tiết</h3>
                <table class="score-table">
                    <thead>
                        <tr>
                            <th>📚 Môn học</th>
                            <th>🎯 Điểm số</th>
                        </tr>
                    </thead>
                    <tbody>${diemRows}</tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }

        document.getElementById("searchBtn").addEventListener("click", () => {
            const sbdValue = document.getElementById("sbdInput").value.trim();
            if (sbdValue === "") {
                alert("❗ Vui lòng nhập số báo danh");
                return;
            }
            if (studentsData.length === 0) {
                alert("⏳ Dữ liệu đang tải, vui lòng chờ 2 giây");
                return;
            }
            renderResult(sbdValue);
        });
        
        document.getElementById("sbdInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") document.getElementById("searchBtn").click();
        });
        
        loadData();
    </script>
</body>
</html>
