<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu điểm thi cuối kỳ 2</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui}
        body{background:linear-gradient(145deg,#e0eafc,#cfdef3);min-height:100vh;margin:0;padding:20px;display:flex;justify-content:center;align-items:center}
        .card{max-width:900px;width:100%;background:white;border-radius:36px;padding:24px 28px 36px;box-shadow:0 25px 45px -12px rgba(0,0,0,0.3)}
        h1{font-size:1.9rem;color:#1a2c3e;margin:0 0 8px}
        .sub{color:#2c5a7a;border-left:4px solid #f97316;padding-left:14px;margin-bottom:28px}
        .search-area{background:#f8fafd;border-radius:32px;padding:20px 24px;margin-bottom:32px}
        label{font-weight:600;color:#0f3b5c;display:block;margin-bottom:8px}
        .sbd-input-group{display:flex;gap:12px;flex-wrap:wrap}
        input{flex:2;padding:14px 18px;font-size:1rem;border:2px solid #e2e8f0;border-radius:44px;background:white}
        input:focus{border-color:#f97316;outline:none}
        button{background:#f97316;border:none;padding:0 28px;border-radius:44px;font-weight:bold;color:white;font-size:1rem;cursor:pointer}
        button:hover{background:#ea580c}
        .result{display:none;animation:fadeIn 0.4s ease}
        .info-box{background:#fef9f0;border-radius:28px;padding:16px 24px;margin-bottom:28px;border:1px solid #ffe0b5}
        .info-box h3{margin:0 0 12px;color:#9b2c1d}
        .info-grid{display:grid;grid-template-columns:auto 1fr;gap:12px 18px}
        .label{font-weight:700;color:#4a3b2c}
        .score-table{width:100%;border-collapse:collapse;background:white;border-radius:24px;overflow:hidden}
        .score-table th{background:#1e293b;color:white;padding:12px 8px}
        .score-table td{padding:12px 8px;text-align:center;border-bottom:1px solid #eef2f6}
        .not-found{background:#fff0f0;border-radius:40px;padding:20px;text-align:center;color:#b91c1c}
        footer{margin-top:32px;font-size:0.75rem;text-align:center;color:#5f6c7a}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @media (max-width:640px){.card{padding:18px}.sbd-input-group button{width:100%;padding:12px;margin-top:8px}.info-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="card">
    <h1>📘 Tra cứu điểm thi</h1>
    <div class="sub">Kỳ thi cuối kỳ 2 · Nhập SBD để xem kết quả</div>
    <div class="search-area">
        <label>🔢 SỐ BÁO DANH (SBD)</label>
        <div class="sbd-input-group">
            <input type="text" id="sbdInput" placeholder="Ví dụ: 001, 012, 123">
            <button id="searchBtn">Tra cứu →</button>
        </div>
    </div>
    <div id="resultContainer" class="result"></div>
    <footer>Hệ thống điểm chính thức · Dữ liệu từ Google Sheets</footer>
</div>
<script>
    // 👇👇👇 THAY LINK NÀY BẰNG LINK API BẠN COPY Ở BƯỚC 1 👇👇👇
    const DATA_API_URL = "https://script.google.com/macros/s/AKfycbzuVUeFZiY1Fah5PpBFzemCQGeyYP3A4TVCM2aOIYWIui8kTkjyl-frbG08TgivY5UAEg/exec";  // ← SỬA LẠI LINK NÀY

    let studentsData = [];

    async function loadData() {
        const container = document.getElementById("resultContainer");
        container.innerHTML = `<div class="not-found">⏳ Đang tải dữ liệu...</div>`;
        container.style.display = "block";
        try {
            const response = await fetch(DATA_API_URL);
            if (!response.ok) throw new Error("Lỗi");
            studentsData = await response.json();
            container.style.display = "none";
        } catch (err) {
            container.innerHTML = `<div class="not-found">⚠️ Lỗi kết nối Google Sheet. Kiểm tra lại link API.</div>`;
        }
    }

    function renderResult(sbd) {
        const student = studentsData.find(s => String(s.SBD).trim() === String(sbd).trim());
        if (!student) {
            document.getElementById("resultContainer").innerHTML = `<div class="not-found">❌ Không tìm thấy SBD: ${sbd}</div>`;
            document.getElementById("resultContainer").style.display = "block";
            return;
        }
        const monHoc = ["Toán", "Ngữ Văn", "Tiếng Anh", "Vật Lý", "Hóa Học", "KTPL", "Địa Lý"];
        let diemRows = "";
        for (let mon of monHoc) {
            let diem = student[mon] !== undefined ? student[mon] : "—";
            diemRows += `<tr><td><strong>${mon}</strong></td><td>${diem}</td></tr>`;
        }
        document.getElementById("resultContainer").innerHTML = `
            <div class="info-box">
                <h3>📌 Thông tin thí sinh</h3>
                <div class="info-grid">
                    <div class="label">Số báo danh:</div><div>${student.SBD}</div>
                    <div class="label">Họ và tên:</div><div>${student["Họ tên"] || "—"}</div>
                    <div class="label">Lớp:</div><div>${student["Lớp"] || "—"}</div>
                </div>
            </div>
            <h3>📊 Bảng điểm</h3>
            <table class="score-table"><thead><tr><th>Môn</th><th>Điểm</th></tr></thead><tbody>${diemRows}</tbody></table>
        `;
        document.getElementById("resultContainer").style.display = "block";
    }

    document.getElementById("searchBtn").onclick = () => {
        let sbd = document.getElementById("sbdInput").value.trim();
        if (!sbd) return alert("Nhập SBD");
        if (studentsData.length === 0) return alert("Đang tải dữ liệu, chờ 2 giây");
        renderResult(sbd);
    };
    document.getElementById("sbdInput").onkeypress = (e) => { if(e.key === "Enter") document.getElementById("searchBtn").click(); };
    loadData();
</script>
</body>
</html>
